<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 90" role="img" aria-labelledby="title desc">
  <title id="title">LytGuide IMS wordmark</title>
  <desc id="desc">The LytGuide IMS name with a green G accent.</desc>
  <style>
    .main {
      fill: #263238;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 56px;
      font-weight: 900;
      letter-spacing: -1px;
    }
    .accent {
      fill: #28d17c;
    }
    .suffix {
      fill: #263238;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 25px;
      font-weight: 500;
      letter-spacing: 2px;
    }
  </style>
  <text class="main" x="4" y="58">Lyt<tspan class="accent">G</tspan>uide</text>
  <text class="suffix" x="210" y="84">IMS</text>
</svg>
