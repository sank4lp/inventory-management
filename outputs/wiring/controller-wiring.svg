<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1280" viewBox="0 0 1800 1280"><rect width="1800" height="1280" fill="#f8fafc"/><style>text{font-family:Arial,sans-serif;fill:#17263d} .title{font-size:34px;font-weight:700}.sub{font-size:20px;fill:#526174}.head{font-size:28px;font-weight:700}.label{font-size:22px}.small{font-size:18px}.wire{fill:none;stroke-width:4;stroke-linecap:round;stroke-linejoin:round}.power{stroke:#dc3545}.ground{stroke:#26364b}.rx{stroke:#2463d3}.tx{stroke:#07845d}.dir{stroke:#a44bb6}.box{fill:white;stroke:#b9c7d7;stroke-width:2}</style><text x="60" y="60" class="title" text-anchor="start">ESP32 controller • soldering connection reference</text><text x="60" y="96" class="sub" text-anchor="start">LM2596 left  /  ESP32 development board center  /  MAX485 module right</text><text x="60" y="128" class="sub" text-anchor="start">Connection schematic: module pin positions are illustrative. Match printed labels on your actual boards.</text><polyline points="430,205 1535,205" class="wire power"/><text x="790" y="190" class="label" text-anchor="start">+5V RAIL</text><polyline points="300,845 1540,845" class="wire ground"/><text x="700" y="880" class="label" text-anchor="start">COMMON GND — all GND symbols connect to this rail</text><rect x="150" y="330" width="280" height="350" rx="18" class="box"/><text x="290" y="375" class="head" text-anchor="middle">LM2596</text><text x="290" y="408" class="sub" text-anchor="middle">buck converter</text><text x="174" y="468" class="label" text-anchor="start">IN+</text><text x="174" y="538" class="label" text-anchor="start">IN−</text><text x="408" y="468" class="label" text-anchor="end">OUT+</text><text x="408" y="608" class="label" text-anchor="end">OUT−</text><polyline points="60,460 150,460" class="wire power"/><text x="60" y="440" class="small" text-anchor="start">24V +</text><polyline points="60,530 150,530" class="wire ground"/><text x="60" y="565" class="small" text-anchor="start">24V −</text><polyline points="430,460 470,460 470,205" class="wire power"/><circle cx="470" cy="205" r="6" fill="#dc3545"/><polyline points="430,600 470,600 470,845" class="wire ground"/><circle cx="470" cy="845" r="6" fill="#26364b"/><text x="290" y="646" class="small" text-anchor="middle">Set OUT to 5.0V first</text><rect x="665" y="330" width="275" height="350" rx="18" class="box"/><text x="802" y="375" class="head" text-anchor="middle">ESP32</text><text x="802" y="408" class="sub" text-anchor="middle">development board</text><text x="802" y="355" class="small" text-anchor="start"></text><text x="730" y="445" class="small" text-anchor="start">VIN / 5V</text><polyline points="720,205 720,330" class="wire power"/><circle cx="720" cy="205" r="6" fill="#dc3545"/><text x="733" y="300" class="small" text-anchor="start">5V input</text><text x="920" y="488" class="small" text-anchor="end">RX2 / GPIO16</text><text x="920" y="558" class="small" text-anchor="end">TX2 / GPIO17</text><text x="920" y="618" class="small" text-anchor="end">D4 / GPIO4</text><text x="802" y="656" class="label" text-anchor="middle">GND</text><polyline points="802,680 802,845" class="wire ground"/><circle cx="802" cy="845" r="6" fill="#26364b"/><rect x="1360" y="330" width="280" height="350" rx="18" class="box"/><text x="1500" y="375" class="head" text-anchor="middle">MAX485</text><text x="1500" y="408" class="sub" text-anchor="middle">5V RS485 module</text><text x="1480" y="445" class="small" text-anchor="start">VCC</text><polyline points="1500,205 1500,330" class="wire power"/><circle cx="1500" cy="205" r="6" fill="#dc3545"/><text x="1380" y="488" class="small" text-anchor="start">RO</text><text x="1380" y="558" class="small" text-anchor="start">DI</text><text x="1380" y="618" class="small" text-anchor="start">DE</text><text x="1380" y="658" class="small" text-anchor="start">/RE</text><text x="1570" y="520" class="label" text-anchor="start">A</text><text x="1570" y="590" class="label" text-anchor="start">B</text><text x="1510" y="656" class="label" text-anchor="start">GND</text><polyline points="1540,680 1540,845" class="wire ground"/><circle cx="1540" cy="845" r="6" fill="#26364b"/><polyline points="940,480 1100,480" class="wire rx"/><rect x="1100" y="468" width="95" height="24" fill="white" stroke="#2463d3" stroke-width="3"/><polyline points="1195,480 1360,480" class="wire rx"/><text x="1148" y="450" class="small" text-anchor="middle">R1: 10kΩ</text><circle cx="1000" cy="480" r="6" fill="#2463d3"/><polyline points="1000,480 1000,530" class="wire rx"/><polyline points="1000,570 1000,590" class="wire rx"/><polyline points="1000,630 1000,697" class="wire rx"/><path d="M1000 530 Q1024 550 1000 570 M1000 590 Q1024 610 1000 630" class="wire rx"/><rect x="988" y="697" width="24" height="75" fill="white" stroke="#2463d3" stroke-width="3"/><polyline points="1000,772 1000,845" class="wire rx"/><circle cx="1000" cy="845" r="6" fill="#26364b"/><text x="1032" y="738" class="small" text-anchor="start">R2: 20kΩ</text><text x="1032" y="768" class="small" text-anchor="start">to GND</text><polyline points="940,550 1360,550" class="wire tx"/><text x="1190" y="538" class="small" text-anchor="middle">TX → DI</text><polyline points="940,610 1300,610 1360,610" class="wire dir"/><polyline points="1300,610 1300,650 1360,650" class="wire dir"/><circle cx="1300" cy="610" r="6" fill="#a44bb6"/><text x="1180" y="595" class="small" text-anchor="middle">Join DE + /RE</text><polyline points="1250,205 1250,255" class="wire power"/><circle cx="1250" cy="205" r="6" fill="#dc3545"/><polyline points="1232,255 1268,255" class="wire power"/><polyline points="1232,269 1268,269" class="wire ground"/><polyline points="1250,269 1250,292" class="wire ground"/><polyline points="1250,292 1250,304" class="wire ground"/><polyline points="1235,304 1265,304" class="wire ground"/><polyline points="1240,312 1260,312" class="wire ground"/><polyline points="1245,320 1255,320" class="wire ground"/><text x="1220" y="241" class="small" text-anchor="end">C1: 100nF</text><text x="1220" y="270" class="small" text-anchor="end">ceramic (104)</text><text x="1220" y="300" class="small" text-anchor="end">VCC ↔ GND, close to MAX485</text><polyline points="1640,510 1700,510" class="wire tx"/><polyline points="1640,580 1700,580" class="wire rx"/><text x="1690" y="475" class="small" text-anchor="end">To USB–RS485</text><text x="1700" y="540" class="small" text-anchor="end">A → A</text><text x="1700" y="610" class="small" text-anchor="end">B → B</text><text x="1515" y="730" class="small" text-anchor="end">Adapter GND → common GND</text><text x="1080" y="810" class="small" text-anchor="start">Blue arcs cross wires without joining.</text><rect x="60" y="930" width="1680" height="265" rx="18" class="box"/><text x="85" y="969" class="head" text-anchor="start">If reconnecting the WS2812 LED matrix</text><polyline points="95,1030 340,1030" class="wire tx"/><rect x="340" y="1018" width="95" height="24" fill="white" stroke="#07845d" stroke-width="3"/><polyline points="435,1030 700,1030" class="wire tx"/><text x="95" y="1012" class="small" text-anchor="start">ESP32 GPIO18 / D18</text><text x="387" y="1073" class="small" text-anchor="middle">R3: 330Ω</text><text x="715" y="1037" class="label" text-anchor="start">First matrix IN</text><polyline points="1030,1010 1360,1010" class="wire power"/><text x="1375" y="1017" class="small" text-anchor="start">Matrix V+ (+5V)</text><polyline points="1030,1140 1360,1140" class="wire ground"/><text x="1375" y="1147" class="small" text-anchor="start">Matrix V− (GND)</text><polyline points="1120,1010 1120,1060" class="wire power"/><circle cx="1120" cy="1010" r="6" fill="#dc3545"/><polyline points="1097,1060 1143,1060" class="wire power"/><polyline points="1097,1076 1143,1076" class="wire ground"/><polyline points="1120,1076 1120,1140" class="wire ground"/><circle cx="1120" cy="1140" r="6" fill="#26364b"/><text x="1148" y="1054" class="label" text-anchor="start">+</text><text x="1160" y="1090" class="small" text-anchor="start">C2: 1000µF, ≥10V</text><text x="1160" y="1117" class="small" text-anchor="start">electrolytic; stripe = −</text><text x="85" y="1130" class="small" text-anchor="start">C2 is across 5V and GND, near the first matrix.</text><text x="85" y="1162" class="small" text-anchor="start">Power every matrix from the rails; check the LED load against your 5V supply capacity.</text><text x="60" y="1230" class="small" text-anchor="start">Before power-on: meter-check 5.0V • never put 5V on 3V3 / RX2 • disconnect external 5V when USB flashing</text><text x="60" y="1260" class="small" text-anchor="start">Optional RS485 termination: 120Ω across A and B only at bus ends; check for an existing module resistor first.</text></svg>