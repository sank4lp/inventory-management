<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Searchable dropdown browser checks</title><link rel="stylesheet" href="/work.css"><style>body{font:16px system-ui;padding:24px}form{max-width:520px;margin:20px 0}label{display:block}#results{white-space:pre-wrap}</style><body><h1>Searchable dropdown checks</h1><p>Disposable DOM fixtures only. No server mutations.</p><div id="fixtures"></div><pre id="results" role="status">Running…</pre><script type="module">
import {init,restore,sync} from '/client/searchable-select.js';
const root=document.querySelector('#fixtures'),results=document.querySelector('#results'),passed=[];
const assert=(condition,message)=>{if(!condition)throw Error(message);passed.push(message);};
const turn=()=>new Promise(r=>setTimeout(r,0));const wait=()=>new Promise(r=>setTimeout(r,300));
const key=(input,value)=>input.dispatchEvent(new KeyboardEvent('keydown',{key:value,bubbles:true,cancelable:true}));
const type=(input,value)=>{input.value=value;input.dispatchEvent(new Event('input',{bubbles:true}));};
try{
 root.innerHTML='<form><label for="person">Assign to</label><select id="person" name="assigneeId" data-searchable required><option value="">Choose person</option><option value="1" selected>Alex</option><option value="2">Sam</option><option value="3" disabled>Inactive</option></select><button>Save</button></form>';
 init(root);let form=root.querySelector('form'),select=form.elements.assigneeId,input=form.querySelector('[role=combobox]');
 assert(form.querySelectorAll('input').length===1,'One visible field');assert(select.id==='person'&&new FormData(form).get('assigneeId')==='1','Canonical ID/name/value retained');assert(input.value==='Alex','Initial selection label');
 type(input,'Sam');assert(select.value===''&&!input.checkValidity(),'Typing clears old ID and is invalid until selected');let submits=0;form.addEventListener('submit',e=>{e.preventDefault();submits++;});form.requestSubmit();assert(submits===0,'Native form submission blocks unmatched required text');key(input,'Enter');assert(select.value==='','Enter does not guess first match');key(input,'Tab');assert(select.value==='','Tab does not choose');key(input,'ArrowDown');key(input,'Enter');assert(select.value==='2'&&input.checkValidity(),'Arrow and Enter explicitly select');assert(new FormData(form).get('assigneeId')==='2','Form serialization uses selected ID');input.click();form.querySelector('[role=option]').click();assert(select.value==='1'&&input.getAttribute('aria-expanded')==='false','Pointer selection closes list without label reopening');select.value='2';sync(root);
 input.click();key(input,'Escape');assert(input.getAttribute('aria-expanded')==='false'&&select.value==='2','Escape closes list and preserves selected ID');
 select.disabled=true;await turn();assert(input.disabled,'Disabled state propagates');select.disabled=false;await turn();select.options[2].disabled=true;await turn();assert(select.value===''&&input.value==='','Option availability changes invalidate old ID');
 select.required=false;await turn();type(input,'');assert(input.checkValidity()&&new FormData(form).get('assigneeId')==='','Optional selection can clear');type(input,'nobody');assert(!input.checkValidity(),'Arbitrary optional text cannot submit');
 root.innerHTML='<form><label>Product<select data-searchable name="productId" required><option value="">Choose</option><option value="5">Cases</option></select></label></form>';await turn();form=root.querySelector('form');select=form.elements.productId;input=form.querySelector('[role=combobox]');assert(Boolean(input),'Dynamic form enhanced without another handler');input.value='Unfinished search';select.value='';restore(root);assert(input.value==='Unfinished search'&&!input.checkValidity(),'Unselected query draft restored safely');select.value='5';restore(root);assert(input.value==='Cases','Canonical selected draft restores label');
 root.innerHTML='<dialog open><form><label>Saved movement<select data-searchable data-search-remote="movements" name="duplicateOf" required><option value="">Choose movement</option><option value="old" selected>Older saved movement</option></select></label></form></dialog>';init(root);form=root.querySelector('form');select=form.elements.duplicateOf;input=form.querySelector('[role=combobox]');const calls=[];select.addEventListener('combobox:search',e=>{e.preventDefault();calls.push(e.detail);});
 input.click();await wait();calls[0].resolve({options:[{value:'new',label:'Newest movement'}]});await turn();assert(select.value==='old'&&input.value==='Older saved movement','Remote reopen retains choice outside first page');
 type(input,'old query');await wait();type(input,'new query');await wait();calls[2].resolve({options:[{value:'new-query',label:'Latest result'}]});calls[1].resolve({options:[{value:'stale',label:'STALE RESULT'}]});await turn();assert(!form.textContent.includes('STALE RESULT')&&form.textContent.includes('Latest result'),'Late remote response cannot replace newer results');assert(select.value==='','Remote results never auto-select');
 key(input,'ArrowDown');key(input,'Enter');assert(select.value==='new-query','Explicit remote choice');type(input,'missing');await wait();calls.at(-1).resolve({options:[],message:'No matching movements.'});await turn();assert(form.textContent.includes('No matching movements.'),'Remote empty state visible');
 type(input,'error');await wait();calls.at(-1).reject('Reconnect to search.');assert(form.textContent.includes('Reconnect to search.'),'Remote error visible');
 type(input,'detached');await wait();const detached=calls.at(-1);root.replaceChildren();await turn();detached.resolve({options:[{value:'bad',label:'Detached result'}]});assert(!root.textContent.includes('Detached result'),'Detached response ignored');
 results.textContent=passed.map(x=>'PASS '+x).join('\n')+'\n'+passed.length+' browser checks passed';
}catch(error){results.textContent=passed.map(x=>'PASS '+x).join('\n')+'\nFAIL '+error.stack;}
</script></body></html>
